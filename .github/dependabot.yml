# Dependabot — the other half of docs/review.md finding 12.
#
# The CI audit job tells you a dependency has a known vulnerability. This opens
# the pull request that fixes it. Neither is much use without the other: a red
# tick with no upgrade path is a build nobody can turn green, and an upgrade
# nobody is told they need is one nobody makes.
#
# Weekly rather than daily, and grouped rather than one PR per package, because
# this is a small pinned tree and a stream of single-package PRs is the fastest
# way to teach a team to stop reading them. Security updates are ungrouped and
# arrive as soon as they exist -- those are the ones worth interrupting for.

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # `update-types` deliberately omitted: without it a major escapes into a
      # PR of its own, which is how a first run produced seven. Majors are worth
      # reading, but one at a time is a stream nobody reads.
      python:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        # Angular packages move as a set; upgrading one alone usually fails the
        # build on a peer-dependency mismatch rather than producing anything
        # useful to review. Capped at minor/patch because a major is a framework
        # migration: Dependabot's first attempt proposed 20 -> 22 with a
        # typescript bump Angular's own peer range forbade, so `npm ci` could
        # not resolve it -- and v21+ requires Node >=24.15, which this project's
        # machine does not have (frontend/README.md). Raise it deliberately.
        patterns: ['@angular*', 'zone.js', 'typescript']
        update-types: [minor, patch]
      jasmine:
        # The test stack moves together or not at all. jasmine-core, its types
        # and the karma reporter that peer-depends on both arrived as three
        # separate PRs, two of which could not install alone.
        patterns: ['jasmine*', '@types/jasmine', 'karma*']
      client:
        patterns: ['*']
        exclude-patterns: ['@angular*', 'zone.js', 'typescript', 'jasmine*', '@types/jasmine', 'karma*']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
