# Continuous integration.
#
# One job per reason a build can be wrong, so a red tick says which: `check` is
# the code, `migrations` is the schema, `eval` is the accuracy, `client app` is
# the browser bundle and its contract with the server, `image` is the container,
# and `dependency audit` is everything we did not write. PLAN.md Phase 8
# scheduled this; it lands early because Phase 3 is the first phase with enough
# moving parts to regress silently.
#
# CLAUDE.md 7 makes "CI must never hit a paid API" an invariant. The enforcement
# is structural rather than aspirational: no provider secret is passed to any
# job, and the `no paid API calls` step below fails the build if one ever is.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push supersedes the run it interrupted; don't burn minutes finishing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the compose stack and the settings defaults, so the suite needs no
  # .env in CI (app/core/config.py).
  DATABASE_URL: postgresql+asyncpg://opuscovintel:opuscovintel@localhost:5432/opuscovintel
  DATABASE_URL_RO: postgresql+asyncpg://opuscovintel_ro:opuscovintel_ro@localhost:5432/opuscovintel
  ENVIRONMENT: test
  LOG_LEVEL: WARNING

jobs:
  check:
    name: lint · type · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # pgvector, not plain postgres: document_chunks.embedding is a
        # vector(1024) column, so the extension has to exist before the schema
        # can be created at all.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opuscovintel
          POSTGRES_PASSWORD: opuscovintel
          POSTGRES_DB: opuscovintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opuscovintel -d opuscovintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Verify no paid API calls are possible
        # The suite skips `live_llm` tests unless RUN_LIVE_LLM_TESTS=1, but that
        # guard only helps while nobody hands CI a key. This fails loudly if a
        # future change adds one.
        run: |
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY QWEN_API_KEY RUN_LIVE_LLM_TESTS; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is set in CI; CLAUDE.md 7 forbids billable calls here"
              exit 1
            fi
          done
          echo "no provider credentials in the environment"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --locked, not --frozen: both install exactly what uv.lock pins, but
        # --frozen ignores pyproject.toml entirely, so a dependency added
        # without re-locking would be silently absent. --locked fails instead.
        # Python 3.12 comes from uv; the runner's system Python is not the
        # pinned interpreter (pyproject requires >=3.12,<3.13).
        run: uv sync --all-groups --locked

      - name: Prepare the database
        # Creates the extensions and the read-only role the query agent will
        # use (CLAUDE.md 1.6). Compose runs this from an init mount, which
        # service containers have no equivalent for.
        env:
          PGPASSWORD: opuscovintel
        run: |
          psql -h localhost -U opuscovintel -d opuscovintel -v ON_ERROR_STOP=1 \
            -f docker/postgres/init/01-init.sql

      - name: Lint
        run: make lint

      - name: Type-check
        run: make type

      - name: Test
        # REQUIRE_POSTGRES turns "no database reachable" from a skip into a
        # failure. Without it, losing the service container would silently skip
        # every database-backed test and CI would still be green.
        env:
          REQUIRE_POSTGRES: "1"
        run: make test

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opuscovintel
          POSTGRES_PASSWORD: opuscovintel
          POSTGRES_DB: opuscovintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opuscovintel -d opuscovintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-groups --locked

      - name: Apply from scratch
        run: uv run alembic upgrade head

      - name: Roll all the way back and re-apply
        # A downgrade nobody exercises is a downgrade that does not work. This
        # is also what catches an anonymous constraint the naming convention
        # missed, since Alembic cannot drop what it cannot name.
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Check for model/schema drift
        # Fails when a model changed without a migration -- the failure mode
        # that only shows up in production, on someone else's machine.
        run: |
          uv run alembic check 2>&1 | tee drift.txt
          grep -q "No new upgrade operations detected" drift.txt

      - name: Check enum vocabularies against the database
        # `alembic check` cannot see these. Alembic excludes type-bound CHECK
        # constraints from autogenerate, so adding a value to a StrEnum without
        # a migration passes the step above and then fails on an INSERT in
        # production. This asks the migrated database directly.
        run: uv run opuscovintel check-schema

  eval:
    name: eval harness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A fourth job for the same reason as the first three: it fails for its own
    # reason. `check` says the code is wrong, `migrations` says the schema is,
    # and this says the pipeline no longer extracts what it used to -- which the
    # unit tests cannot tell you, because it is a measurement rather than an
    # assertion about one function.
    #
    # $0 by construction: no metric calls a model, and the same "no provider
    # credentials" step guards it as guards `check` (CLAUDE.md 7).

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opuscovintel
          POSTGRES_PASSWORD: opuscovintel
          POSTGRES_DB: opuscovintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opuscovintel -d opuscovintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Verify no paid API calls are possible
        run: |
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY QWEN_API_KEY; do
            if [ -n "${!name:-}" ]; then
              # No backticks in this string: inside double quotes the shell
              # would run whatever they contain.
              echo "::error::$name is set; the eval harness must cost nothing"
              exit 1
            fi
          done

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-groups --locked

      - name: Prepare the database
        env:
          PGPASSWORD: opuscovintel
        run: |
          psql -h localhost -U opuscovintel -d opuscovintel -v ON_ERROR_STOP=1 \
            -f docker/postgres/init/01-init.sql

      - name: Ingest the corpus and score it
        # `eval-demo` is migrate + seed + ingest + index + extract + eval, so
        # this also proves the $0 pipeline still runs end to end from nothing.
        # `opuscovintel eval` exits non-zero when a read path misses its
        # PLAN.md target (9/13 deterministic, 11/13 agent).
        run: make eval-demo

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: warn

  frontend:
    name: client app
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A fifth job, for the fifth reason a build can be wrong: the client app
    # compiles, its tests pass, and its types still match the server's. It
    # needs no database and no Python beyond generating the schema.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-groups --locked

      - run: npm ci
        working-directory: frontend

      - name: Check the generated API types are current
        # The client's types come from the server's OpenAPI document. If a
        # Pydantic model changed and nobody ran `make frontend-types`, the
        # client is compiling against a contract the server no longer serves --
        # the same class of failure `alembic check` catches for the schema.
        run: |
          make frontend-types
          git diff --exit-code -- frontend/openapi.json frontend/src/app/api/schema.d.ts \
            || (echo "::error::run 'make frontend-types' and commit the result"; exit 1)

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        # Chrome is preinstalled on the runner; karma.conf.js adds --no-sandbox.
        run: npm run test:ci
        working-directory: frontend

  image:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: opuscovintel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probe liveness and readiness
        # /health must answer even with no database -- a database blip should
        # not make an orchestrator kill a healthy container. /ready must answer
        # 503 in the same situation, so the instance leaves the load balancer
        # without being restarted. Running with no database reachable is the
        # only way to tell those two apart.
        run: |
          docker run -d --name opuscovintel-ci -p 8000:8000 opuscovintel:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS http://localhost:8000/health | tee health.json
          grep -q '"status":"ok"' health.json

          ready_code=$(curl -s -o ready.json -w '%{http_code}' http://localhost:8000/ready)
          echo "GET /ready -> $ready_code"
          if [ "$ready_code" != "503" ]; then
            echo "::error::/ready returned $ready_code with no database; it must report 503"
            docker logs opuscovintel-ci
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs opuscovintel-ci || true

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A sixth job, for the sixth reason a build can be wrong: the code is fine
    # and something it depends on is not. docs/review.md finding 12.
    #
    # It fails the build rather than warning. A warning nobody is required to
    # read is theatre, and the surface here is small and pinned, so a red tick
    # means something real. The escape hatch is deliberate and reviewable:
    # `.github/pip-audit-ignore.txt` lists advisory IDs with a reason and a
    # date, so a blocked release is a decision somebody signed rather than a
    # flag somebody flipped.
    #
    # Note for anyone editing this: `uv pip audit` does not exist, despite
    # being the obvious guess (and what review.md originally suggested). The
    # tool is PyPA's `pip-audit`, run here through `uvx` at a pinned version --
    # a scanner that silently upgrades itself is a supply-chain surface of its
    # own.

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Python dependencies
        # Exported from uv.lock, so this audits the versions that actually
        # ship, not whatever the resolver would pick today. Dev groups are
        # included: they run in CI and on developer machines, which is where a
        # compromised test dependency would execute.
        run: |
          uv export --format requirements-txt --no-emit-project --all-groups \
            > /tmp/requirements-audit.txt

          ignores=""
          if [ -f .github/pip-audit-ignore.txt ]; then
            while read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              ignores="$ignores --ignore-vuln ${line%% *}"
            done < .github/pip-audit-ignore.txt
          fi

          # shellcheck disable=SC2086
          uvx pip-audit@2.10.1 \
            --requirement /tmp/requirements-audit.txt \
            --progress-spinner off \
            --strict \
            $ignores

      - name: Audit client app dependencies
        # The client ships to a browser, so its tree is part of the same
        # surface. `npm ci` is not needed -- audit reads the lockfile.
        working-directory: frontend
        run: npm audit --audit-level=high
