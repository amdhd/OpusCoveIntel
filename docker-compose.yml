# Local development stack.
#
# Deliberately three services. Redis, Celery, and MinIO stay deferred to Phase 8
# (CLAUDE.md 9) -- they add operational surface the MVP does not need yet.

name: opuscovintel

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opuscovintel
      POSTGRES_PASSWORD: opuscovintel
      POSTGRES_DB: opuscovintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first init of the volume; see the file header.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opuscovintel -d opuscovintel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is `db`, not localhost.
      DATABASE_URL: postgresql+asyncpg://opuscovintel:opuscovintel@db:5432/opuscovintel
      DATABASE_URL_RO: postgresql+asyncpg://opuscovintel_ro:opuscovintel_ro@db:5432/opuscovintel
      STORAGE_DIR: /app/var/storage
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      # The host's `var/storage`, not a named volume. See the note at the foot
      # of this file.
      - ./var/storage:/app/var/storage
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "app.worker.main"]
    # The image's HEALTHCHECK curls /health, but the worker serves no HTTP.
    # Without this override it is permanently "unhealthy", which trains people
    # to ignore the one signal that should mean something.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://opuscovintel:opuscovintel@db:5432/opuscovintel
      DATABASE_URL_RO: postgresql+asyncpg://opuscovintel_ro:opuscovintel_ro@db:5432/opuscovintel
      STORAGE_DIR: /app/var/storage
    env_file:
      - path: .env
        required: false
    volumes:
      # Shared with api so the worker reads documents the API wrote.
      - ./var/storage:/app/var/storage
    restart: unless-stopped

volumes:
  pgdata:

# -- why documents live on a bind mount, not a named volume ------------------
#
# `STORAGE_DIR` holds the PDF bytes every citation ultimately points at, and it
# was a named volume shared by api and worker. Correct for those two, and a
# trap for everyone else: `uv run uvicorn` and `opuscovintel ingest` write to
# the host's `./var/storage`, which the containers could not see, so a document
# ingested from a terminal was invisible to the compose stack and vice versa.
#
# The failure is not subtle once it happens -- the worker claims the job, finds
# no object at the storage key, and marks the document `failed`. But it takes a
# while to *understand*, because both halves are behaving correctly and the
# database rows are identical either way.
#
# One directory, both worlds. It is also a directory you can list, back up and
# point a colleague at, which a named volume is not.
#
# Production is a different question and has a different answer: object storage
# (docs/plan.md defers S3/MinIO to Phase 8), where the shared-filesystem assumption
# stops holding the moment the api and the worker run on different hosts.
