<form class="login panel" (ngSubmit)="submit()">
  <h1>Sign in</h1>

  @if (error()) {
    <p class="alert error">{{ error() }}</p>
  }

  <label for="username">Username</label>
  <input
    id="username"
    name="username"
    type="text"
    autocomplete="username"
    [(ngModel)]="username"
    required
    autofocus
  />

  <label for="password">Password</label>
  <input
    id="password"
    name="password"
    type="password"
    autocomplete="current-password"
    [(ngModel)]="password"
    required
  />

  <button class="primary" type="submit" [disabled]="busy()">
    {{ busy() ? 'Signing in…' : 'Sign in' }}
  </button>

  <p class="muted" style="font-size: 0.8rem; margin-top: 1rem">
    Accounts are created by an operator: <code>opuscovintel user-add</code>.
    Passwords are at least twelve characters.
  </p>
</form>
