<header class="topbar">
  <a class="brand" routerLink="/documents">OpusCovIntel</a>
  <nav>
    <a routerLink="/ask" routerLinkActive="on">Ask</a>
    <a routerLink="/instruments" routerLinkActive="on">Instruments</a>
    <a routerLink="/documents" routerLinkActive="on">Documents</a>
    <a routerLink="/review" routerLinkActive="on">
      Review
      @if (pending()) {
        <!-- Same destination and same word for both roles: an analyst and a
             reviewer talking about "Review" must mean the same screen. Only
             the badge's weight changes, because only one of them can act. -->
        <span
          class="pill"
          [class.passive]="!auth.canReview()"
          [attr.aria-label]="
            auth.canReview()
              ? pending() + ' items awaiting your decision'
              : pending() + ' items awaiting a reviewer'
          "
        >
          {{ pending() }}
        </span>
      }
    </a>
    <!-- Portfolios and the provenance viewer are still server-rendered; the
         link leaves the app rather than pretending the screen exists here. -->
    <a href="/ui/portfolios">Portfolios ↗</a>
  </nav>
  <div class="signout">
    <span class="who">
      {{ auth.user()?.display_name }}
      <!-- The role is the only thing that changes what this person may do, so
           it says what that is rather than making them find out by clicking. -->
      <em
        [class.may-review]="auth.canReview()"
        [title]="
          auth.canReview()
            ? 'Reviewer — may approve, correct and reject queue items'
            : 'Analyst — read-only; may not decide queue items'
        "
      >
        {{ auth.user()?.role }}
      </em>
    </span>
    <button type="button" (click)="signOut()">Sign out</button>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer>
  Decision support, not investment or legal advice. Every figure is machine-extracted
  and intended for human review.
</footer>
